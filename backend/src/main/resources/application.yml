server:
  port: 8080
  compression:
    enabled: true

spring:
  application:
    name: ai-mock-interview-platform
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/interview_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

gemini:
  api-key: ${GOOGLE_API_KEY:${GEMINI_API_KEY:}}
  model: gemini-2.5-flash
  temperature: 0.4
  eval-temperature: 0.2
